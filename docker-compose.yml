version: "3.9"
services:
  inventory-db:
    image: postgres:16
    container_name: inventory-db
    environment:
      - POSTGRES_DB=inventory_db
      - POSTGRES_USER=inventory_user
      - POSTGRES_PASSWORD=inventory_pass
    ports:
      - "5433:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=order_user
      - POSTGRES_PASSWORD=order_pass
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=inventory_user
      - SPRING_DATASOURCE_PASSWORD=inventory_pass
      - JWT_SECRET=change-this-secret-key-change-this-secret-key
      - JWT_EXPIRY_SECONDS=3600
      - APP_USER_USERNAME=appuser
      - APP_USER_PASSWORD=appuser123
      - APP_ADMIN_USERNAME=admin
      - APP_ADMIN_PASSWORD=admin123
    depends_on:
      - inventory-db

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_pass
      - JWT_SECRET=change-this-secret-key-change-this-secret-key
      - JWT_EXPIRY_SECONDS=3600
      - APP_USER_USERNAME=appuser
      - APP_USER_PASSWORD=appuser123
      - APP_ADMIN_USERNAME=admin
      - APP_ADMIN_PASSWORD=admin123
    depends_on:
      - inventory-service
      - order-db

volumes:
  inventory-db-data:
  order-db-data:
